<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClearBlock</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1>ClearBlock</h1>
          <p id="status-label">Full protection on</p>
        </div>
      </div>
      <label class="switch">
        <input id="enabled-toggle" type="checkbox" checked />
        <span class="slider"></span>
      </label>
    </header>

    <section class="stats">
      <div>
        <strong id="page-count">0</strong>
        <span>This page</span>
      </div>
      <div>
        <strong id="total-count">0</strong>
        <span>All time</span>
      </div>
    </section>

    <p class="host" id="host-label">No active tab</p>

    <div class="lists" id="list-toggles">
      <label><input id="list-ads" type="checkbox" checked /> Ads</label>
      <label><input id="list-trackers" type="checkbox" checked /> Trackers</label>
      <label><input id="list-annoyances" type="checkbox" checked /> Annoyances</label>
      <label><input id="list-youtube" type="checkbox" checked /> YouTube</label>
    </div>

    <button id="pause-btn" type="button">Pause on this site</button>
    <button id="options-btn" class="ghost" type="button">Settings</button>
  </body>
  <script src="popup.js"></script>
</html>
